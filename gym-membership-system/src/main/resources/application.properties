spring.application.name=gym-membership-system

# Database: the values after ':' are the local defaults. Set DB_URL, DB_USERNAME and DB_PASSWORD when deployed.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gym}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never

# Hosts such as Render provide PORT. Locally it stays 8086.
server.port=${PORT:8086}

# Comma-separated list of frontend origins allowed to call the API (add your Netlify address when deployed).
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174}
